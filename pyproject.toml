[project]
name = "sovereign-mind"
version = "0.1.0"
description = "Enterprise-Grade Private AI Assistant with Zero-Knowledge Storage"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    # Backend & API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    # Orchestration & LLM
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-ollama>=0.1.0",
    "openai>=1.12.0",
    # Memory (RAG)
    "chromadb>=0.4.22",
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.0",
    "networkx>=3.0.0",
    "mem0ai>=0.1.20",
    # Privacy (PII Detection & Anonymization)
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    # Security & Cryptography
    "cryptography>=42.0.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    # Settings & Validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    # Logging
    "structlog>=24.1.0",
    # Document Processing
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    # Utilities
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    # Rate limiting
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.5.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"

# =============================================================================
# Ruff (linter + formatter)
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["scripts/"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "S",     # flake8-bandit (security)
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T20",   # flake8-print
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]
ignore = [
    "S101",   # assert used (OK in tests)
    "S104",   # binding to all interfaces (OK for dev server)
    "S311",   # pseudo-random (OK for non-crypto uses)
    "E501",   # line too long (formatter handles this)
    "B008",   # function call in default arg (FastAPI Depends pattern)
    "B904",   # raise from in except (standard FastAPI HTTPException pattern)
    "DTZ003", # datetime.utcnow() (acceptable in existing code)
    "N818",   # exception naming suffix (existing API, would break compat)
    "RUF012", # mutable class default (Pydantic models handle this correctly)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S113", "T20", "N806"]
"app/main.py" = ["T20"]
"app/services/rag_engine.py" = ["E402", "S324"]
"app/services/knowledge_graph.py" = ["S301"]
"app/core/inference_engine.py" = ["S603"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# mypy (type checking)
# =============================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/", "data/", "ui/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# =============================================================================
# pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=app --cov-report=term-missing --cov-report=html"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "vault: tests requiring vault operations",
    "rag: tests for RAG functionality",
    "integration: tests requiring running services",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/__init__.py"]

[tool.coverage.report]
fail_under = 50
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "\\.\\.\\.",
]
